name: <%= @args[0] || "worktree" %>
root: <%= ENV["WORKTREE_ROOT"] || "." %>

windows:
  - nvim: nvim
  - claude:
      layout: even-horizontal
      panes:
        - <%= ENV["CLAUDE_LEFT_CMD"] || "claude" %>
        - <%= ENV["CLAUDE_RIGHT_CMD"] || "claude" %>
  - zsh:
      layout: even-horizontal
      panes:
        - ~
        - ~
